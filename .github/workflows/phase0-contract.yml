name: Phase 0 Contract Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "codex/**"
      - "ai/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-gate:
    name: contract-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contract
        run: python scripts/validate_contract.py
