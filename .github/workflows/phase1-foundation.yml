name: Phase 1 Foundation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
  
permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: dexo_land.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py check
      - run: uv run python scripts/export_tap_v2_openapi.py --check

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: dexo_land.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: dexo_land_test
      POSTGRES_USER: dexo_land
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://dexo_land:ci-password@localhost:5672//
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dexo_land_test
          POSTGRES_USER: dexo_land
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dexo_land -d dexo_land_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: dexo_land
          RABBITMQ_DEFAULT_PASS: ci-password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: B2 isolated PostgreSQL benchmark
        run: B2_BENCHMARK=1 uv run pytest apps/base_tap/tests/test_benchmark.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: b2-postgres-benchmark
          path: work/b2-benchmark.json

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --tag dexo-land:${{ github.sha }} .
      - run: docker run --rm dexo-land:${{ github.sha }} python scripts/admin_static_smoke.py
      - name: Start and smoke test application services
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs; docker compose down --volumes' EXIT
          docker compose up --build --detach --wait
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready > /dev/null; then
              ready=1
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          if [ "$ready" -ne 1 ]; then
            echo "Application did not become ready within 60 seconds."
            docker compose ps
            docker compose logs --no-color api
            docker compose logs --no-color worker
            docker compose logs --no-color beat
            exit 1
          fi
          test "$(docker compose ps --status running --services | grep -Ec '^(api|worker|beat)$')" -eq 3
          docker compose exec -T beat test -w /app/run
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/admin/login/ > /tmp/admin-login.html
          admin_asset="$(grep -oE '/static/admin/(css|js)/[^\" ]+' /tmp/admin-login.html | head -1)"
          test -n "$admin_asset"
          curl --fail --silent --show-error "http://127.0.0.1:8000${admin_asset}" > /dev/null
