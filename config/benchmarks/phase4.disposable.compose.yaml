services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phase4_disposable
      POSTGRES_USER: phase4
      POSTGRES_PASSWORD: phase4_test_only
    ports: ['127.0.0.1:15432:5432']
    tmpfs: ['/var/lib/postgresql/data']
  redis:
    image: redis:8-alpine
    ports: ['127.0.0.1:16379:6379']
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: phase4
      RABBITMQ_DEFAULT_PASS: phase4_test_only
    ports: ['127.0.0.1:15672:5672']
