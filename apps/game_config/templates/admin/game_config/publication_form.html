{% extends "admin/base_site.html" %}
{% block content %}
<h2>{{ config.version }} effective {{ config.effective_at }}</h2>
{% if issues %}<ul class="errorlist">{% for issue in issues %}<li>{{ issue }}</li>{% endfor %}</ul>{% endif %}
{% if error %}<p class="errornote">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="submit" value="Publish validated draft" {% if issues %}disabled{% endif %}></form>
{% endblock %}
